name: Build Godot 4 iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/TowerWars1.xcodeproj

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Payload & IPA Package
        run: |
          cd build/ios
          xcodebuild -project TowerWars1.xcodeproj -scheme TowerWars1 -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath TowerWars1.xcarchive
          mkdir -p Payload
          cp -r TowerWars1.xcarchive/Products/Applications/*.app Payload/
          zip -r TowerWars1.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars1-iOS-IPA
          path: build/ios/TowerWars1.ipa
