name: "Export and Build iOS App"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Download and Install Godot iOS Export Templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          curl -L -o ~/Library/Application\ Support/Godot/export_templates/4.3.stable/ios.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          
          # فك ضغط قالب الـ iOS في مكانه الصحيح
          cd ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          unzip -o ios.zip

      - name: Import Godot Assets
        run: |
          godot --headless --verbose --editor --quit

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          godot --headless --verbose --export-debug "iOS" build/ios/game.xcodeproj

      - name: Build Unsigned IPA with Xcode
        run: |
          cd build/ios
          xcodebuild -project game.xcodeproj \
            -scheme game \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          mkdir -p Payload
          mv build/Debug-iphoneos/game.app Payload/
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-Build
          path: build/ios/game.ipa
