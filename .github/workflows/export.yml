name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Download & Extract Official Export Templates
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates templates.tpz

      - name: Ensure Dummy Icon Exists
        run: |
          if [ ! -f "icon.svg" ]; then
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#478cbf"/></svg>' > icon.svg
          fi

      - name: Create export directory
        run: mkdir -p build/ios

      - name: Import Godot Assets
        run: |
          godot --headless --editor --quit || true

      - name: Export Xcode Project from Godot
        run: |
          godot --headless --verbose --export-release "iOS" build/ios/game.xcodeproj

      - name: Build Xcode Project Unsigned
        run: |
          xcodebuild build \
            -project build/ios/game.xcodeproj \
            -scheme game \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || true
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: game.ipa
