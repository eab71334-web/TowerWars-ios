name: "Export and Build iOS App"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      - name: Prepare iOS export template
        run: |
          godot --version
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"

          # دوّر على ios.zip في أي مكان
          FOUND=$(find "$HOME" -name "ios.zip" -not -path "*/node_modules/*" 2>/dev/null | head -n 1 || true)
          echo "Found: $FOUND"

          if [ -z "$FOUND" ]; then
            echo "Downloading templates manually..."
            curl -fL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            cp -r /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"
            FOUND="$TEMPLATE_DIR/ios.zip"
          elif [ ! -f "$TEMPLATE_DIR/ios.zip" ]; then
            cp "$FOUND" "$TEMPLATE_DIR/ios.zip"
          fi

          test -f "$TEMPLATE_DIR/ios.zip"
          echo "IOS_ZIP=$TEMPLATE_DIR/ios.zip" >> "$GITHUB_ENV"
          ls -la "$TEMPLATE_DIR"

      - name: Fix export preset
        run: |
          sed -i '' "s|custom_template/debug=\".*\"|custom_template/debug=\"$IOS_ZIP\"|" export_presets.cfg
          sed -i '' "s|custom_template/release=\".*\"|custom_template/release=\"$IOS_ZIP\"|" export_presets.cfg
          sed -i '' 's|application/bundle_identifier=".*"|application/bundle_identifier="com.eab71334.towerwars"|' export_presets.cfg
          sed -i '' 's|application/export_project_only=.*|application/export_project_only=true|' export_presets.cfg
          sed -i '' 's|^export_path=".*"|export_path="build/ios/game.xcodeproj"|' export_presets.cfg
          grep -E "custom_template|bundle_identifier|team_id|export_path|export_project_only|targeted_device" export_presets.cfg

      - name: Import Godot Assets
        run: godot --headless --verbose --editor --quit || true

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          set +e
          godot --headless --verbose --export-debug "iOS" build/ios/game.xcodeproj > export.log 2>&1
          CODE=$?
          set -e

          echo "=========== FULL EXPORT LOG ==========="
          cat export.log
          echo "======================================="

          if [ ! -d build/ios/game.xcodeproj ]; then
            echo "Export failed, no xcodeproj created (exit code $CODE)"
            exit 1
          fi

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

      - name: Build Unsigned IPA with Xcode
        run: |
          cd build/ios
          xcodebuild -project game.xcodeproj \
            -scheme game \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath out \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -r out/Build/Products/Debug-iphoneos/game.app Payload/
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-Build
          path: build/ios/game.ipa
