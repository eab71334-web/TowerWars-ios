name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0

      - name: Setup Export Templates
        run: |
          GODOT_VERSION="4.3.stable"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -LO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip "Godot_v${GODOT_VERSION}_export_templates.tpz"
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates "Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj

      - name: Build Xcode App
        run: |
          cd build/ios
          xcodebuild build \
            -project TowerWars.xcodeproj \
            -scheme TowerWars \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          cd build/ios
          mkdir -p Payload
          mv build/Release-iphoneos/TowerWars.app Payload/ 2>/dev/null || mv build/Release-iphoneos/*.app Payload/
          zip -r TowerWars.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-iOS-IPA
          path: build/ios/TowerWars.ipa
