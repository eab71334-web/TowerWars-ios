name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export iOS Project from Godot
        uses: firebelley/godot-export@v6
        with:
          godot_version: 4.3
          export_debug: false
          relative_project_path: ./
          archive_output: false

      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild build \
            -project TowerWars.xcodeproj \
            -scheme TowerWars \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          cd build/ios
          mkdir -p Payload
          mv build/Release-iphoneos/TowerWars.app Payload/ 2>/dev/null || mv build/Release-iphoneos/*.app Payload/ 2>/dev/null || mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r TowerWars.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-iOS-IPA
          path: build/ios/TowerWars.ipa
