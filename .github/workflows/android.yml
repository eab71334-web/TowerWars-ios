name: "Build Android APK"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      - name: Ensure Android export templates
        run: |
          godot --version
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            FOUND=$(find "$HOME" -name "android_debug.apk" 2>/dev/null | head -n 1 || true)
            echo "Found: $FOUND"
            if [ -n "$FOUND" ]; then
              cp "$(dirname "$FOUND")"/* "$TEMPLATE_DIR/"
            else
              curl -fL -o /tmp/templates.tpz \
                "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
              unzip -q /tmp/templates.tpz -d /tmp/godot_templates
              cp -r /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"
            fi
          fi
          ls -la "$TEMPLATE_DIR" | grep -i android
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" > /dev/null
          ls "$SDK/build-tools"

      - name: Debug keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/debug.keystore"
            echo "Using keystore from secret"
          else
            keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            echo "Generated a new keystore"
          fi

      - name: Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.5.tres"

      - name: Add Android export preset
        run: |
          python3 - <<'PY'
          import re
          p = "export_presets.cfg"
          s = open(p, encoding="utf-8").read() if __import__("os").path.exists(p) else ""
          if 'platform="Android"' not in s:
              n = len(re.findall(r'^\[preset\.\d+\]$', s, flags=re.M))
              s += f'''
          [preset.{n}]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/BlockTower.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.{n}.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.eab71334.blocktower"
          package/name="BlockTower"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/internet=true
          permissions/vibrate=true
          '''
              open(p, "w", encoding="utf-8").write(s)
          PY
          grep -n -E 'platform=|package/unique_name' export_presets.cfg

      - name: Project settings check
        run: |
          grep -n -E "etc2_astc|rendering_method|run/main_scene" project.godot || true

      - name: Import Godot Assets
        run: godot --headless --verbose --editor --quit || true

      - name: Export Android APK
        run: |
          mkdir -p build/android
          set +e
          godot --headless --verbose --export-debug "Android" build/android/BlockTower.apk > android-export.log 2>&1
          CODE=$?
          set -e
          echo "=========== ERRORS (wrapped) ==========="
          grep -n -i -E "error|invalid|missing|not found|fail" android-export.log | fold -w 55 | head -40 || true
          echo "========================================"
          if [ ! -f build/android/BlockTower.apk ]; then
            echo "Export failed (exit code $CODE)"
            exit 1
          fi
          ls -la build/android

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-log
          path: android-export.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/android/BlockTower.apk
